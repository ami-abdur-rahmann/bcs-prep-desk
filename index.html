    applyTheme();
    if (d.notify && 'Notification' in window && Notification.permission === 'default') Notification.requestPermission().then(p => { if (p !== 'granted') toast('Notifications were not allowed — in-app reminders still work'); });
  }, {ok:'Settings saved', mount: f => { f.querySelector('#importFile').addEventListener('change', ev => { const file = ev.target.files[0]; if (file) importJSON(file); }); }});
}

/* ----- flashcard quiz ----- */
let quiz = null;
function startQuiz(ids, label){
  if (!ids.length) { toast('No flashcards yet — add some inside a topic'); return; }
  quiz = {ids, i:0, show:false, right:0, wrong:0, label};
  openDialog(`Flashcards · ${label}`, '<div id="quizBody"></div>', null, {});
  renderQuiz();
}
function renderQuiz(){
  const el = $('#quizBody'); if (!el || !quiz) return;
  if (quiz.i >= quiz.ids.length) {
    el.innerHTML = `<div class="qcard" style="text-align:center"><div class="q">Done! ${quiz.right} / ${quiz.ids.length} correct</div><div class="muted small">${quiz.wrong?'Missed cards come first next time.':'Perfect round.'}</div></div><div class="row" style="justify-content:flex-end;padding-bottom:6px"><button type="button" class="btn" data-act="closeDialog">Close</button>${quiz.wrong?'<button type="button" class="btn primary" data-act="quizRetry">Retry missed</button>':''}</div>`;
    return;
  }
  const c = S.cards[quiz.ids[quiz.i]]; if (!c) { quiz.i++; renderQuiz(); return; }
  el.innerHTML = `<div class="row prog"><span>${quiz.i+1} / ${quiz.ids.length}</span><span class="spacer"></span><span>${esc(topicName(c.topicId))}</span></div>
    <div class="qcard"><div class="q">${esc(c.q)}</div>${quiz.show?`<div class="a">${esc(c.a)}</div>`:''}</div>
    <div class="row" style="justify-content:flex-end;padding-bottom:6px">${quiz.show?`<button type="button" class="btn danger" data-act="quizMark" data-r="0">Missed <kbd>2</kbd></button><button type="button" class="btn ok" data-act="quizMark" data-r="1">Got it <kbd>1</kbd></button>`:`<button type="button" class="btn primary" data-act="quizShow" autofocus>Show answer <kbd>Space</kbd></button>`}</div>`;
  el.querySelector('.btn.primary,.btn.ok')?.focus();
}
function practiceDlg(){
  const subs = subjects().filter(s => arr('cards').some(c=>c.subjectId===s.id));
  const cnt = arr('cards').length, due = dueTopics().filter(t=>arr('cards').some(c=>c.topicId===t.id));
  if (!cnt) { toast('No flashcards yet — open a topic and add cards'); return; }
  openDialog('Flashcard practice', `
    ${fld('Which cards', `<select name="scope"><option value="all">All subjects (${cnt})</option>${due.length?`<option value="due">Topics due for revision (${due.length} topics)</option>`:''}${subs.map(s=>`<option value="${s.id}">${esc(s.name)} (${arr('cards').filter(c=>c.subjectId===s.id).length})</option>`).join('')}</select>`)}
    ${fld('How many', `<select name="n"><option value="10">10 cards</option><option value="20" selected>20 cards</option><option value="50">50 cards</option><option value="9999">All</option></select>`, '', 'Cards you missed before, and cards not seen for longest, come first')}
  `, d => {
    const dueIds = new Set(due.map(t=>t.id));
    let list = arr('cards').filter(c => d.scope==='all' ? true : d.scope==='due' ? dueIds.has(c.topicId) : c.subjectId===d.scope);
    list = sortBy(list, c => ((c.wrong||0) - (c.right||0)) * -1000 + (c.last ? diff(c.last, today()) * -1 : -500)).slice(0, +d.n);
    const lbl = d.scope==='all' ? 'All subjects' : d.scope==='due' ? 'Due topics' : subName(d.scope);
    return () => startQuiz(list.map(c=>c.id), lbl);
  }, {submit:'Start'});
}

/* ----- search ----- */
function searchDlg(){
  openDialog('Search', `<input class="inp" id="sq" placeholder="Topics, videos, mistakes, flashcards, plans…" autofocus><div class="sres" id="sres"></div>`, null, {mount: f => {
    const q = f.querySelector('#sq'), out = f.querySelector('#sres'); let sel = 0, items = [];
    const run = () => {
      const s = q.value.trim().toLowerCase(); items = [];
      if (s) {
        arr('topics').forEach(t => { if ((t.name+' '+(t.note||'')+' '+(t.pyq||'')).toLowerCase().includes(s)) items.push({ty:'Topic', t:t.name, sub:subName(t.subjectId), act:'openTopic', id:t.id}); });
        arr('videos').forEach(v => { if ((v.title+' '+(v.teacher||'')).toLowerCase().includes(s)) items.push({ty:'Video', t:v.title, sub:subName(v.subjectId), act: v.topicId?'openTopic':'openSubject', id: v.topicId || v.subjectId}); });
        arr('mistakes').forEach(m => { if ((m.note||'').toLowerCase().includes(s)) items.push({ty:KIND[m.kind]||'Mistake', t:m.note, sub:subName(m.subjectId), act:'editMistake', id:m.id}); });
        arr('cards').forEach(c => { if ((c.q+' '+c.a).toLowerCase().includes(s)) items.push({ty:'Flashcard', t:c.q, sub:c.a, act:'openTopic', id:c.topicId}); });
        arr('plans').forEach(p => { const nm = topicName(p.topicId)||p.title||''; if ((nm+' '+(p.source||'')).toLowerCase().includes(s)) items.push({ty:'Plan · '+fmtD(p.date), t:nm||subName(p.subjectId), sub:p.source||'', act:'editPlan', id:p.id}); });
        subjects().forEach(x => { if (x.name.toLowerCase().includes(s)) items.push({ty:'Subject', t:x.name, sub:`${x.marks} marks`, act:'openSubject', id:x.id}); });
      }
      items = items.slice(0, 40); sel = 0;
      out.innerHTML = s ? (items.length ? items.map((it,i)=>`<button type="button" class="${i===0?'sel':''}" data-act="${it.act}" data-id="${it.id}"><span class="ty">${esc(it.ty)}</span><span>${esc(it.t)}</span><span class="small muted">${esc(it.sub)}</span></button>`).join('') : '<div class="empty">No matches</div>') : '<div class="small muted" style="padding:8px">Type to search. <kbd>↑</kbd><kbd>↓</kbd> to move, <kbd>Enter</kbd> to open.</div>';
    };
    q.addEventListener('input', run);
    q.addEventListener('keydown', e => {
      const bs = out.querySelectorAll('button');
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!bs.length) return; bs[sel]?.classList.remove('sel'); sel = (sel + (e.key==='ArrowDown'?1:-1) + bs.length) % bs.length; bs[sel].classList.add('sel'); bs[sel].scrollIntoView({block:'nearest'}); }
      if (e.key === 'Enter') { e.preventDefault(); bs[sel]?.click(); }
    });
    run();
  }});
}
function shortcutsDlg(){
  openDialog('Keyboard shortcuts', `<div class="shortcuts">
    <span><kbd>1</kbd>–<kbd>5</kbd></span><span>Switch view: Today, Subjects, Revision, Planner, Analysis</span>
    <span><kbd>/</kbd> or <kbd>Ctrl</kbd>+<kbd>K</kbd></span><span>Search everything</span>
    <span><kbd>S</kbd></span><span>Start a study timer (or stop the running one)</span>
    <span><kbd>P</kbd></span><span>New plan</span>
    <span><kbd>T</kbd></span><span>New topic</span>
    <span><kbd>L</kbd></span><span>Log study time</span>
    <span><kbd>M</kbd></span><span>Log a mistake</span>
    <span><kbd>F</kbd></span><span>Flashcard practice</span>
    <span><kbd>Ctrl</kbd>+<kbd>Enter</kbd></span><span>Save the open form</span>
    <span><kbd>Esc</kbd></span><span>Close</span>
  </div>`, null);
}

/* ================= actions ================= */
function setStatus(t, s){
  t.status = s; let msg = null;
  if (s === 'done' && !t.nextRev) { t.studiedAt = today(); t.revStage = 0; t.nextRev = addDays(today(), INT[0]); msg = 'Nice! First revision is tomorrow'; }
  if (s !== 'done' && t.nextRev && !(t.revLog||[]).length) { t.nextRev = null; t.studiedAt = null; }
  commit(msg);
}
function revise(t, g){
  const stage = t.revStage || 0;
  const ns = g === 'good' ? Math.min(stage+1, INT.length-1) : Math.max(0, stage-1);
  t.revStage = ns; t.nextRev = addDays(today(), INT[ns]); t.revLog = [...(t.revLog||[]), {d:today(), r:g}]; t.status = 'done'; t.studiedAt = t.studiedAt || today();
  commit(`Next revision: ${fmtD(t.nextRev)}`);
}
function arm(el, label){ if (el.dataset.armed) return true; el.dataset.armed = '1'; const old = el.textContent; el.textContent = label || 'Sure? Click again'; setTimeout(()=>{ if (el.isConnected) { delete el.dataset.armed; el.textContent = old; } }, 3500); return false; }
const A = {
  go: el => { ui.view = el.dataset.v; if (ui.view !== 'subjects') ui.subjectId = null; try { localStorage.setItem(KEY+':view', ui.view); } catch(e){} closeDetail(); closeDialog(); scrollTo(0,0); render(); },
  openSubject: el => { closeDialog(); closeDetail(); ui.view = 'subjects'; ui.subjectId = el.dataset.id; ui.filter = 'all'; scrollTo(0,0); render(); },
  backSubjects: () => { ui.subjectId = null; render(); },
  filter: el => { ui.filter = el.dataset.f; render(); },
  togglePast: () => { ui.showPast = !ui.showPast; render(); },
  openTopic: el => openTopic(el.dataset.id),
  closeDetail: () => closeDetail(),
  closeDialog: () => { closeDialog(); quiz = null; },
  addSubject: () => dlgSubject(),
  editSubject: el => dlgSubject(S.subjects[el.dataset.id]),
  addTopic: el => dlgTopic(null, el.dataset.sid || ui.subjectId),
  editTopic: el => dlgTopic(S.topics[el.dataset.id]),
  bulkTopics: el => dlgBulk(el.dataset.sid),
  addVideo: el => dlgVideo(null, el.dataset.sid, el.dataset.tid),
  editVideo: el => dlgVideo(S.videos[el.dataset.id]),
  logVideo: el => { const v = S.videos[el.dataset.id]; dlgSession(null, {sid:v.subjectId, tid:v.topicId, vid:v.id, kind:'video'}); },
  startVideo: el => { const v = S.videos[el.dataset.id]; startTimer({kind:'video', subjectId:v.subjectId, topicId:v.topicId, videoId:v.id}); if (v.url) window.open(v.url, '_blank', 'noopener'); },
  logSession: el => dlgSession(null, {sid:el.dataset.sid, tid:el.dataset.tid}),
  editSession: el => dlgSession(S.sessions[el.dataset.id]),
  startDlg: el => dlgStart({sid:el.dataset.sid, tid:el.dataset.tid}),
  startPlan: el => { const p = S.plans[el.dataset.id]; startTimer({kind:'reading', subjectId:p.subjectId, topicId:p.topicId, pomo:null}); },
  stopTimer: () => stopTimer(),
  discardTimer: el => { if (!arm(el, 'Discard?')) return; S.timer = null; commit('Timer discarded'); },
  addPlan: el => dlgPlan(null, el.dataset.date, el.dataset.sid, el.dataset.tid),
  editPlan: el => dlgPlan(S.plans[el.dataset.id]),
  bulkPlan: () => dlgBulkPlan(),
  togglePlan: el => { const p = S.plans[el.dataset.id]; p.done = !p.done; commit(p.done ? 'Done' : null); },
  moveToday: el => { S.plans[el.dataset.id].date = today(); commit('Moved to today'); },
  moveAllMissed: () => { const m = missedPlans(); m.forEach(p => p.date = today()); commit(`${m.length} moved to today`); },
  addExam: () => dlgExam(),
  editExam: el => dlgExam(S.exams[el.dataset.id]),
  addMistake: el => dlgMistake(null, {examId:el.dataset.exam, sid:el.dataset.sid || ui.subjectId, tid:el.dataset.tid}),
  editMistake: el => dlgMistake(S.mistakes[el.dataset.id]),
  toggleMistake: el => { const m = S.mistakes[el.dataset.id]; m.resolved = !m.resolved; commit(m.resolved ? 'Marked as fixed' : null); },
  addCard: el => dlgCard(null, el.dataset.tid),
  editCard: el => dlgCard(S.cards[el.dataset.id]),
  bulkCards: el => dlgBulkCards(el.dataset.tid),
  quizTopic: el => { const t = S.topics[el.dataset.id]; startQuiz(sortBy(arr('cards').filter(c=>c.topicId===t.id), c=>(c.right||0)-(c.wrong||0)).map(c=>c.id), t.name); },
  practice: () => practiceDlg(),
  quizShow: () => { quiz.show = true; renderQuiz(); },
  quizMark: el => { const c = S.cards[quiz.ids[quiz.i]]; const ok = el.dataset.r === '1'; if (c) { if (ok) c.right = (c.right||0)+1; else { c.wrong = (c.wrong||0)+1; (quiz.missed = quiz.missed||[]).push(c.id); } c.last = today(); } ok ? quiz.right++ : quiz.wrong++; quiz.i++; quiz.show = false; persist(); render(); renderQuiz(); },
  quizRetry: () => { const ids = quiz.missed || []; quiz = {ids, i:0, show:false, right:0, wrong:0, label:quiz.label}; renderQuiz(); },
  setStatus: el => setStatus(S.topics[el.dataset.id], el.dataset.s),
  revise: el => revise(S.topics[el.dataset.id], el.dataset.g),
  snooze: el => { const t = S.topics[el.dataset.id]; t.nextRev = addDays(t.nextRev < today() ? today() : t.nextRev, 1); commit(`Moved to ${fmtD(t.nextRev)}`); },
  settings: () => dlgSettings(),
  search: () => searchDlg(),
  linkFile: () => linkFile(),
  reconnectFile: () => reconnectFile(),
  exportJSON: () => exportJSON(),
  resetAll: el => { if (!arm(el, 'Erase everything? Click again')) return; S = blank(); seedSubjectsOnly(); closeDialog(); closeDetail(); commit('All data erased'); },
  clearSamples: el => { if (!arm(el)) return; MAPS.forEach(m => Object.values(S[m]).forEach(o => { if (o.sample) delete S[m][o.id]; })); commit('Sample data cleared'); },
  del: el => {
    if (!arm(el)) return;
    const col = el.dataset.col, id = el.dataset.id;
    delete S[col][id];
    if (col === 'topics') { arr('cards').forEach(c => { if (c.topicId === id) delete S.cards[c.id]; }); if (ui.detail === id) closeDetail(); }
    if (col === 'subjects' && ui.subjectId === id) ui.subjectId = null;
    closeDialog(); commit('Deleted');
  }
};
function seedSubjectsOnly(){ const s = seed(); S.subjects = s.subjects; }

/* ================= events ================= */
document.addEventListener('click', e => {
  if (e.target.closest('a[href]')) return;
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el);
});
document.addEventListener('keydown', e => {
  const dlgOpen = !$('#dialogLayer').hidden;
  if (e.key === 'Escape') { if (dlgOpen) { closeDialog(); quiz = null; } else if (ui.detail) closeDetail(); return; }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); searchDlg(); return; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if (dlgOpen && quiz && !typing) {
    if (e.key === ' ' && !quiz.show && quiz.i < quiz.ids.length) { e.preventDefault(); A.quizShow(); }
    else if (quiz.show && (e.key === '1' || e.key === '2')) { e.preventDefault(); A.quizMark({dataset:{r: e.key==='1'?'1':'0'}}); }
    return;
  }
  if (typing || dlgOpen || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (/^[1-5]$/.test(k)) { A.go({dataset:{v:VIEWS[+k-1][0]}}); }
  else if (k === '/') { e.preventDefault(); searchDlg(); }
  else if (k === 's') { S.timer ? stopTimer() : dlgStart({}); }
  else if (k === 'p') dlgPlan(null, today());
  else if (k === 't') dlgTopic(null, ui.subjectId);
  else if (k === 'l') dlgSession(null, {});
  else if (k === 'm') dlgMistake(null, {sid:ui.subjectId});
  else if (k === 'f') practiceDlg();
  else if (k === '?') shortcutsDlg();
});
addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS.some(x=>x[0]===v)) A.go({dataset:{v}}); });
addEventListener('scroll', () => $('#topbar').classList.toggle('scrolled', scrollY > 4), {passive:true});
addEventListener('storage', e => { if (e.key === KEY) { const o = load(); if (o) { S = o; render(); } } });
let tt = 0;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(()=>{ t.hidden = true; }, 3000); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); checkReminders(); } });
let lastDay = today();
setInterval(() => { checkReminders(); if (today() !== lastDay) { lastDay = today(); render(); } }, 30000);

applyTheme();
render();
initFile();
setTimeout(checkReminders, 1500);
if (firstRun) setTimeout(() => toast('Welcome! Sample data is loaded so you can explore — press ? for shortcuts'), 600);
})();
</script>

<div id="updateBar" hidden style="position:fixed;right:20px;bottom:20px;z-index:70;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;font-size:.9rem">
  <span>A new version of BCS Prep Desk is ready.</span><button class="btn sm primary" id="updateBtn">Update now</button>
</div>
<script>
/* PWA: offline support, install button, update prompt */
(() => {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  let deferred = null;
  const ib = document.getElementById('installBtn');
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; ib.hidden = false; });
  ib.addEventListener('click', async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; ib.hidden = true; });
  addEventListener('appinstalled', () => { ib.hidden = true; });
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      const offer = w => { const bar = document.getElementById('updateBar'); bar.hidden = false; document.getElementById('updateBtn').onclick = () => w.postMessage('skipWaiting'); };
      if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
      reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); }); });
      setInterval(() => reg.update().catch(()=>{}), 60*60*1000);
    }).catch(err => console.warn('Service worker not registered', err));
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded) { reloaded = true; location.reload(); } });
  });
})();
</script>
