<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E6A4E">
<meta name="description" content="Personal BCS exam preparation tracker — topics, videos, revision schedule, planner and exam analysis.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>BCS Prep Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F2F4F0; --surface:#FFFFFF; --surface-2:#E9EEE8; --ink:#14201A; --ink-2:#435148; --muted:#6A7970;
  --line:#D8DFD9; --accent:#0E6A4E; --accent-ink:#FFFFFF; --accent-soft:#DCEDE5;
  --haldi:#C98A0B; --haldi-soft:#FBEFD3; --haldi-ink:#6B4700;
  --danger:#B63A26; --danger-soft:#F8E2DD; --ok:#2C7A4B; --ok-soft:#DEF0E4; --warn:#A8690F;
  --margin:#E0A29B; --shadow:0 12px 32px -12px rgba(20,40,30,.3);
  --f-display:"Schibsted Grotesk","Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Schibsted Grotesk","Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1310; --surface:#151E19; --surface-2:#1D2822; --ink:#E4EBE6; --ink-2:#B8C4BC; --muted:#8B998F;
    --line:#29362F; --accent:#48B98C; --accent-ink:#06140E; --accent-soft:#16352A;
    --haldi:#E9B347; --haldi-soft:#392C0F; --haldi-ink:#F4D38E;
    --danger:#EE7A64; --danger-soft:#3C1B15; --ok:#5CC987; --ok-soft:#143222; --warn:#E3A546;
    --margin:#7A3C37; --shadow:0 14px 34px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1310; --surface:#151E19; --surface-2:#1D2822; --ink:#E4EBE6; --ink-2:#B8C4BC; --muted:#8B998F;
  --line:#29362F; --accent:#48B98C; --accent-ink:#06140E; --accent-soft:#16352A;
  --haldi:#E9B347; --haldi-soft:#392C0F; --haldi-ink:#F4D38E;
  --danger:#EE7A64; --danger-soft:#3C1B15; --ok:#5CC987; --ok-soft:#143222; --warn:#E3A546;
  --margin:#7A3C37; --shadow:0 14px 34px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;margin:0;text-wrap:balance;font-weight:650;letter-spacing:-.01em}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
kbd{font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface);color:var(--ink-2)}

/* shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{align-self:start;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;padding:22px 14px 16px;border-right:1px solid var(--line);background:var(--surface);overflow-y:auto}
.brand{padding:2px 10px 18px 12px;position:relative}
.brand::before{content:"";position:absolute;left:0;top:2px;bottom:16px;border-left:2px solid var(--margin)}
.brand b{font-family:var(--f-display);font-size:1.3rem;font-weight:750;display:block;line-height:1.1;letter-spacing:-.02em}
.brand span{font-size:.8rem;color:var(--muted)}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-size:.95rem}
.nav svg{width:18px;height:18px;flex:none}
.nav:hover{background:var(--surface-2)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .count{margin-left:auto;font-family:var(--f-mono);font-size:.7rem;background:var(--danger);color:#fff;border-radius:9px;padding:0 6px}
.nav kbd{margin-left:auto;opacity:.7}
.nav .count + kbd{margin-left:6px}
.side .sep{height:1px;background:var(--line);margin:12px 6px}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:8px 6px 0;font-size:.78rem;color:var(--muted)}
.side .foot .bk{display:flex;align-items:center;gap:6px}
.side .foot .bk i{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.side .foot .bk.ok i{background:var(--ok)} .side .foot .bk.warn i{background:var(--warn)}
.main{min-width:0;padding-inline:32px;padding-block:0 56px}
.wrap{max-width:1180px;margin-inline:auto}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);margin-inline:-32px;padding:14px 32px;display:flex;align-items:center;gap:12px;border-bottom:1px solid transparent}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar h1{font-size:1.4rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.searchbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px 5px 11px;color:var(--muted);cursor:pointer;font-size:.88rem;min-width:200px}
.searchbtn kbd{margin-left:auto}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{display:none}.side .sep,.side .foot,.nav kbd{display:none}
  .nav{width:auto}
  .main{padding-inline:16px}.topbar{margin-inline:-16px;padding:12px 16px}
  .searchbtn{min-width:0}.searchbtn span,.searchbtn kbd{display:none}
}

/* blocks */
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr))}
.grid3{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card > h2,.sec-h{font-size:1.02rem;display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.sec-h h2,.sec-h h3{font-size:1.02rem}
.spacer{flex:1}
.card h2 small,.sec-h small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.82rem}
.muted{color:var(--muted)} .small{font-size:.85rem}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.88rem;white-space:nowrap;line-height:1.4}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:3px 9px;font-size:.8rem}
.btn.danger{color:var(--danger)} .btn.danger[data-armed]{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{border:0;background:none;width:30px;height:30px;border-radius:7px;cursor:pointer;font-size:1.05rem;color:var(--ink-2);display:inline-grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.73rem;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;line-height:1.6}
.pill.imp{background:var(--haldi-soft);color:var(--haldi-ink);font-weight:600}
.pill.over{background:var(--danger-soft);color:var(--danger);font-weight:600}
.pill.due{background:var(--haldi-soft);color:var(--haldi-ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.sample{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.st-todo{background:var(--surface-2);color:var(--muted)} .st-doing{background:var(--haldi-soft);color:var(--haldi-ink)} .st-done{background:var(--ok-soft);color:var(--ok)}
.meter{display:inline-flex;gap:2px;align-items:flex-end;height:14px;vertical-align:-2px;flex:none}
.meter i{width:4px;border-radius:1px;background:var(--line)}
.meter i:nth-child(1){height:6px}.meter i:nth-child(2){height:8px}.meter i:nth-child(3){height:10px}.meter i:nth-child(4){height:12px}.meter i:nth-child(5){height:14px}
.meter i.on{background:var(--haldi)}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:3px}
.empty{padding:14px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:.88rem;text-align:center}

.alert{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.alert .ic{flex:none;min-width:26px;height:26px;padding:0 6px;border-radius:7px;display:grid;place-items:center;font-weight:700;font-family:var(--f-mono);font-size:.85rem}
.alert > div{flex:1;min-width:0}
.alert.imp{background:var(--haldi-soft);border-color:color-mix(in srgb,var(--haldi) 35%,transparent)} .alert.imp .ic{background:var(--haldi);color:#fff}
.alert.rev{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 30%,transparent)} .alert.rev .ic{background:var(--danger);color:#fff}
.alert.info .ic{background:var(--accent-soft);color:var(--accent)}
.alert b{font-weight:600}
.alert p{margin:2px 0 0;font-size:.88rem;color:var(--ink-2)}
.alert .row{margin-top:8px}

/* hero */
.hero{display:grid;gap:12px;grid-template-columns:1.3fr 1.5fr 1fr 1fr}
@media (max-width:1000px){.hero{grid-template-columns:1fr 1fr}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.stat .k{font-size:.78rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.stat .v{font-family:var(--f-mono);font-size:1.45rem;line-height:1.25;margin-top:2px}
.stat .v small{font-size:.8rem;color:var(--muted)}
.stat.count{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);position:relative}
.stat.count .k{color:inherit;opacity:.85}
.stat.count .v{font-family:var(--f-display);font-weight:750;font-size:1.75rem;letter-spacing:-.02em}
.stat.count button{position:absolute;right:10px;top:9px;background:transparent;border:0;color:inherit;opacity:.85;cursor:pointer;font-size:.76rem;text-decoration:underline}
.goal .bar{height:8px;margin-top:8px}
.goal .streak{font-family:var(--f-mono);font-size:.78rem;color:var(--haldi-ink);background:var(--haldi-soft);padding:0 7px;border-radius:6px;margin-left:auto}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:9px 2px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .mt{flex:1 1 200px;min-width:0}
.item .t{font-weight:500;overflow-wrap:anywhere}
.item .s{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 10px;align-items:center;margin-top:1px}
.clk{cursor:pointer;border-radius:6px}
.item.clk:hover,.mt.clk:hover .t{color:var(--accent)}
.item .time{font-family:var(--f-mono);font-size:.84rem;color:var(--ink-2);width:46px;flex:none}
.item .acts{display:flex;gap:4px;align-items:center;flex-wrap:nowrap}
.check{width:21px;height:21px;flex:none;border-radius:6px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0}
.check:hover{border-color:var(--ok)}
.check.on{background:var(--ok);border-color:var(--ok)}
.check.on::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.done-t{text-decoration:line-through;color:var(--muted)}
.day-h{font-family:var(--f-display);font-weight:650;font-size:.92rem;padding:14px 2px 4px;display:flex;gap:8px;align-items:center;color:var(--ink-2)}
.day-h.today{color:var(--accent)}
.day-h small{font-family:var(--f-body);font-weight:400;color:var(--muted)}

/* subjects */
.subgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.subcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.subcard:hover{border-color:var(--accent)}
.subcard h3{font-size:1rem;flex:1}
.marks{font-family:var(--f-mono);font-size:.76rem;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:6px;flex:none}
.subcard .meta{display:flex;gap:6px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:.82rem;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.back{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:.9rem}

/* drawer + dialog */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.42);z-index:40}
.drawer{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bg);box-shadow:var(--shadow);border-left:1px solid var(--line);display:flex;flex-direction:column}
.drawer header{display:flex;gap:10px;align-items:flex-start;padding:16px 18px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.drawer header h2{font-size:1.3rem}
.drawer .body{overflow-y:auto;padding:16px 18px 32px;display:flex;flex-direction:column;gap:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 13px;cursor:pointer;font-size:.85rem;color:var(--ink-2)}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.dlg-scrim{z-index:50}
.dialog{position:fixed;z-index:51;inset:0;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;pointer-events:none}
.dlg-card{pointer-events:auto;background:var(--surface);width:100%;max-width:540px;border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:88vh;border:1px solid var(--line)}
.dlg-card.wide{max-width:720px}
.dlg-card header{display:flex;align-items:center;padding:14px 16px 6px}
.dlg-card header h3{flex:1;font-size:1.12rem}
.dlg-body{padding:6px 16px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.dlg-card footer{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:10px 16px 14px;border-top:1px solid var(--line)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld > span{font-size:.82rem;color:var(--ink-2);font-weight:500}
.fld small{color:var(--muted);font-size:.76rem}
.fld input,.fld select,.fld textarea,.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;min-width:0}
.fld textarea{min-height:84px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.fgrid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.fgrid3{display:grid;gap:12px;grid-template-columns:1fr 1fr 1fr}
.full{grid-column:1/-1}
.cbx{display:flex;align-items:center;gap:8px;font-size:.88rem}
.stars{display:flex;gap:6px}
.stars label{flex:1;position:relative}
.stars input{position:absolute;opacity:0;pointer-events:none}
.stars span{display:block;text-align:center;border:1px solid var(--line);border-radius:8px;padding:5px 0;cursor:pointer;font-family:var(--f-mono)}
.stars input:checked + span{background:var(--haldi);border-color:var(--haldi);color:#fff}
.stars input:focus-visible + span{outline:2px solid var(--accent)}
details.more{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
details.more summary{cursor:pointer;font-size:.88rem;font-weight:500}
.bd{display:grid;grid-template-columns:1fr 64px 64px;gap:6px 8px;align-items:center;margin-top:10px;font-size:.84rem}
.bd input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 6px;font-family:var(--f-mono)}
.bd .h{color:var(--muted);font-size:.75rem}
.calc{font-family:var(--f-mono);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 10px;font-size:.9rem}

/* timer */
.timer{display:inline-flex;align-items:center;gap:8px;background:var(--danger);color:#fff;border-radius:999px;padding:4px 5px 4px 12px;font-size:.84rem}
.timer.pomo-done{background:var(--ok)}
.timer .n{font-family:var(--f-mono)}
.timer .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.timer button{background:#fff;color:var(--danger);border:0;border-radius:999px;padding:2px 10px;cursor:pointer;font-weight:600;font-size:.78rem}
.timer.pomo-done button{color:var(--ok)}
.timer button.x{background:transparent;color:#fff;padding:2px 6px}
.pulse{width:8px;height:8px;border-radius:50%;background:#fff;animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.25}}

/* charts */
.hbar{display:grid;grid-template-columns:minmax(100px,36%) 1fr auto;gap:7px 10px;align-items:center;font-size:.84rem}
.hbar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.hbar .trk{height:10px;background:var(--surface-2);border-radius:3px;position:relative}
.hbar .trk i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:0 4px 4px 0}
.hbar .trk i.warm{background:var(--danger)}
.hbar .val{font-family:var(--f-mono);font-size:.78rem;color:var(--ink-2);text-align:right;white-space:nowrap}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .axl{fill:var(--muted);font-size:11px;font-family:var(--f-mono)}
.chart .b{fill:var(--accent)} .chart g:hover .b{fill:var(--haldi)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);grid-auto-columns:13px;justify-content:start;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--surface-2)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 25%,var(--surface-2))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 50%,var(--surface-2))}
.heat i.l3{background:color-mix(in srgb,var(--accent) 75%,var(--surface-2))}
.heat i.l4{background:var(--accent)}
.heat i.fut{background:transparent}
.heat i.td{outline:1.5px solid var(--ink-2);outline-offset:0}
.legend{display:flex;gap:4px;align-items:center;font-size:.74rem;color:var(--muted);margin-top:6px}
.legend i{width:11px;height:11px;border-radius:2px;display:inline-block}
.cmp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:700px){.cmp{grid-template-columns:1fr 1fr}}
.cmp div{background:var(--surface-2);border-radius:8px;padding:9px 11px}
.cmp .k{font-size:.76rem;color:var(--muted)}
.cmp .v{font-family:var(--f-mono);font-size:1.15rem}
.cmp .d{font-family:var(--f-mono);font-size:.74rem}
.up{color:var(--ok)} .down{color:var(--danger)}
.tablewrap{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:.86rem}
table.t th,table.t td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th{font-weight:500;color:var(--muted);font-size:.78rem}
table.t td.n,table.t th.n{font-family:var(--f-mono);text-align:right}

/* quiz + search */
.qcard{border:1px solid var(--line);border-radius:12px;padding:22px 18px;min-height:150px;display:flex;flex-direction:column;gap:12px;justify-content:center;background:var(--bg)}
.qcard .q{font-size:1.15rem;font-weight:600;font-family:var(--f-display)}
.qcard .a{font-size:1rem;color:var(--accent);border-top:1px dashed var(--line);padding-top:12px;white-space:pre-wrap}
.prog{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.sres{display:flex;flex-direction:column;max-height:50vh;overflow-y:auto}
.sres button{all:unset;cursor:pointer;padding:8px 10px;border-radius:7px;display:flex;flex-direction:column}
.sres button:hover,.sres button.sel{background:var(--surface-2)}
.sres .ty{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.shortcuts{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:.9rem;align-items:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:60;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:.9rem;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.note{white-space:pre-wrap;font-size:.88rem;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:8px 10px;margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Menu">
    <div class="brand"><b>BCS Prep Desk</b><span>Personal study tracker</span></div>
    <div id="sideNav" style="display:contents"></div>
    <button class="nav" id="installBtn" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span>Install app</span></button>
    <div class="foot" id="sideFoot"></div>
  </aside>
  <main class="main">
    <div class="wrap">
      <div class="topbar" id="topbar">
        <h1 id="viewTitle">Today</h1>
        <span id="timerSlot"></span>
        <button class="searchbtn" data-act="search" aria-label="Search"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Search</span><kbd>/</kbd></button>
      </div>
      <div id="view" class="stack"></div>
    </div>
  </main>
</div>
<div id="detailLayer" hidden></div>
<div id="dialogLayer" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>
<script>
(() => {
'use strict';
/* ================= constants ================= */
const KEY = 'bcs-prep-desk-v1';
const INT = [1,3,7,15,30,60,90];
const MAPS = ['subjects','topics','videos','sessions','plans','exams','mistakes','cards'];
const KIND = {mistake:'Got it wrong', weak:'Weak area', focus:'Needs focus'};
const STATUS = {todo:'Not started', doing:'In progress', done:'Completed'};
const SKIND = {reading:'Reading', video:'Video', practice:'Practice / MCQ', revision:'Revision'};
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const VIEWS = [['today','Today'],['subjects','Subjects'],['revision','Revision'],['plan','Planner'],['analysis','Analysis']];
const ICON = {
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.6" fill="currentColor"/></svg>',
  subjects:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10M9 8h5"/></svg>',
  revision:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/><path d="M12 8v4l3 2"/></svg>',
  plan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>',
  analysis:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  search:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  cards:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>'
};

/* ================= utils ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => ymd(new Date());
const parse = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, (m||1)-1, d||1); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const diff = (a,b) => Math.round((parse(b) - parse(a)) / 86400000);
const fmtD = s => { if (!s) return ''; const d = parse(s); return `${WD[d.getDay()]}, ${d.getDate()} ${d.toLocaleString('en-GB',{month:'short'})}`; };
const rel = s => { const n = diff(today(), s); if (n===0) return 'today'; if (n===1) return 'tomorrow'; if (n===-1) return 'yesterday'; return n<0 ? `${-n} days ago` : `in ${n} days`; };
const mins = m => { m = Math.round(m||0); if (m < 60) return `${m}m`; const h = Math.floor(m/60), r = m%60; return r ? `${h}h ${r}m` : `${h}h`; };
const hm = d => `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const round1 = n => Math.round(n*10)/10;

/* ================= state ================= */
let S = null;
let fileHandle = null, fileState = 'none', fileTimer = 0;
function blank(){ const s = {v:1, settings:{dailyGoalMin:240, negMark:0.5, theme:'auto', notify:false, examName:'', examDate:''}, timer:null}; MAPS.forEach(m => s[m] = {}); return s; }
function seed(){
  const s = blank(); const td = today(); const D = n => addDays(td, n);
  [['bangla','Bangla Language & Literature',30],['english','English Language & Literature',30],['bdaffairs','Bangladesh Affairs',25],['intl','International Affairs',25],['geo','Geography, Environment & Disaster Mgmt.',10],['science','General Science',15],['ict','Computer & ICT',15],['math','Mathematical Reasoning',20],['mental','Mental Ability',15],['ethics','Ethics, Values & Good Governance',15]]
    .forEach(([id,name,marks],i) => s.subjects[id] = {id,name,marks,order:i+1});
  const T = o => ({status:'todo',revStage:0,nextRev:null,revLog:[],note:'',pyq:'',qCount:null,sample:true,createdAt:Date.now(),...o});
  s.topics.s_t1 = T({id:'s_t1',subjectId:'bdaffairs',name:'Liberation War — sectors & commanders',importance:5,pyq:'Sample: asked almost every year',qCount:12,status:'done',studiedAt:D(-4),revStage:1,nextRev:td,revLog:[{d:D(-3),r:'good'}],note:'Sample note: memorise sector number ↔ commander as pairs.'});
  s.topics.s_t2 = T({id:'s_t2',subjectId:'bangla',name:'সমাস (Compound words)',importance:4,pyq:'Sample',status:'doing'});
  s.topics.s_t3 = T({id:'s_t3',subjectId:'math',name:'Percentage & profit-loss',importance:4,pyq:'Sample'});
  s.topics.s_t4 = T({id:'s_t4',subjectId:'ict',name:'Network topology',importance:3});
  s.videos.s_v1 = {id:'s_v1',title:'Samas — full class (sample)',url:'',teacher:'',lengthMin:60,subjectId:'bangla',topicId:'s_t2',done:false,sample:true};
  const at = (d,h) => { const x = parse(d); x.setHours(h,0,0,0); return x.getTime(); };
  s.sessions.s_s1 = {id:'s_s1',d:D(-1),at:at(D(-1),21),min:25,kind:'video',subjectId:'bangla',topicId:'s_t2',videoId:'s_v1',sample:true};
  s.sessions.s_s2 = {id:'s_s2',d:D(-3),at:at(D(-3),19),min:50,kind:'revision',subjectId:'bdaffairs',topicId:'s_t1',sample:true};
  s.sessions.s_s3 = {id:'s_s3',d:D(-2),at:at(D(-2),10),min:40,kind:'practice',subjectId:'math',topicId:'s_t3',sample:true};
  s.plans.s_p1 = {id:'s_p1',date:td,time:'20:00',subjectId:'bangla',topicId:'s_t2',title:'',source:'Grammar book — Samas chapter, then the rest of the video',targetMin:60,done:false,sample:true};
  s.plans.s_p2 = {id:'s_p2',date:D(1),time:'09:00',subjectId:'math',topicId:'s_t3',title:'',source:"Previous years' questions",targetMin:90,done:false,sample:true};
  s.plans.s_p3 = {id:'s_p3',date:D(-2),time:'18:00',subjectId:'ict',topicId:'s_t4',title:'',source:'ICT book, chapter 3',targetMin:45,done:false,sample:true};
  s.exams.s_e1 = {id:'s_e1',name:'Model Test 1 (sample)',date:D(-5),total:200,correct:142,wrong:28,neg:0.5,score:128,bySubject:{bangla:{c:22,w:4},english:{c:19,w:6},bdaffairs:{c:18,w:5},math:{c:11,w:6}},note:'',sample:true};
  s.mistakes.s_m1 = {id:'s_m1',kind:'weak',note:'Percentage problems took too long',subjectId:'math',topicId:'s_t3',examId:'s_e1',resolved:false,date:D(-5),sample:true};
  s.mistakes.s_m2 = {id:'s_m2',kind:'mistake',note:'Mixed up the sector commanders',subjectId:'bdaffairs',topicId:'s_t1',examId:'s_e1',resolved:false,date:D(-5),sample:true};
  s.cards.s_c1 = {id:'s_c1',topicId:'s_t1',subjectId:'bdaffairs',q:'Into how many sectors was Bangladesh divided during the 1971 Liberation War?',a:'11 sectors',right:0,wrong:0,sample:true};
  s.cards.s_c2 = {id:'s_c2',topicId:'s_t1',subjectId:'bdaffairs',q:'On which date did the Liberation War formally begin?',a:'26 March 1971',right:0,wrong:0,sample:true};
  return s;
}
function load(){
  try { const o = JSON.parse(localStorage.getItem(KEY) || 'null'); if (o && o.subjects) { const b = blank(); MAPS.forEach(m => b[m] = o[m] || {}); b.settings = {...b.settings, ...(o.settings||{})}; b.timer = o.timer || null; return b; } } catch(e) {}
  return null;
}
let storageOk = true;
function persist(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; } catch(e) { storageOk = false; toast('Could not save to the browser — export a backup now'); }
  queueFileSave();
}
function commit(msg){ persist(); render(); if (msg) toast(msg); }
S = load();
const firstRun = !S;
if (!S) { S = seed(); persist(); }

/* ================= backup file (File System Access) ================= */
const idb = (op, key, val) => new Promise((res) => {
  try {
    const r = indexedDB.open('bcs-prep-desk', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => { const tx = r.result.transaction('kv', op==='get'?'readonly':'readwrite'); const st = tx.objectStore('kv'); const q = op==='get' ? st.get(key) : op==='del' ? st.delete(key) : st.put(val, key); q.onsuccess = () => res(q.result); q.onerror = () => res(null); };
    r.onerror = () => res(null);
  } catch(e) { res(null); }
});
async function initFile(){
  const h = await idb('get','fh'); if (!h) return;
  fileHandle = h;
  try { const p = await h.queryPermission({mode:'readwrite'}); fileState = p === 'granted' ? 'ok' : 'reconnect'; } catch(e) { fileState = 'reconnect'; }
  renderChrome();
}
function queueFileSave(){ if (fileState !== 'ok') return; clearTimeout(fileTimer); fileTimer = setTimeout(writeFile, 1200); }
async function writeFile(){
  if (!fileHandle) return;
  try { const w = await fileHandle.createWritable(); await w.write(JSON.stringify(S, null, 1)); await w.close(); S.settings.lastBackup = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} fileState = 'ok'; }
  catch(e) { console.error(e); fileState = 'reconnect'; }
  renderChrome();
}
async function linkFile(){
  if (!window.showSaveFilePicker) { toast('This browser cannot auto-save to a file — use Chrome or Edge, or Export instead'); return; }
  try {
    fileHandle = await window.showSaveFilePicker({suggestedName:'bcs-prep-backup.json', types:[{description:'JSON backup', accept:{'application/json':['.json']}}]});
    await idb('put','fh',fileHandle); fileState = 'ok'; await writeFile(); toast('Auto-backup on — every change is saved to that file');
  } catch(e) { if (e.name !== 'AbortError') toast('Could not link the file'); }
}
async function reconnectFile(){
  if (!fileHandle) return;
  try { const p = await fileHandle.requestPermission({mode:'readwrite'}); fileState = p === 'granted' ? 'ok' : 'reconnect'; if (fileState === 'ok') { await writeFile(); toast('Backup file reconnected'); } } catch(e) { fileState = 'reconnect'; }
  renderChrome();
}
function exportJSON(){
  const blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `bcs-prep-backup-${today()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  S.settings.lastBackup = Date.now(); commit('Backup downloaded');
}
function importJSON(file){
  const r = new FileReader();
  r.onload = () => {
    try { const o = JSON.parse(r.result); if (!o || !o.subjects || !o.topics) throw 0; const b = blank(); MAPS.forEach(m => b[m] = o[m] || {}); b.settings = {...b.settings, ...(o.settings||{})}; b.timer = null; S = b; closeDialog(); closeDetail(); applyTheme(); commit('Backup restored'); }
    catch(e) { toast('That file is not a valid backup'); }
  };
  r.readAsText(file);
}

/* ================= selectors ================= */
const arr = m => Object.values(S[m]);
const sortBy = (a, f, dir=1) => a.slice().sort((x,y) => { const p=f(x), q=f(y); return (p>q?1:p<q?-1:0)*dir; });
const subjects = () => sortBy(arr('subjects'), s => s.order ?? 99);
const topicsOf = sid => arr('topics').filter(t => t.subjectId === sid);
const subName = id => S.subjects[id]?.name || '—';
const topicName = id => S.topics[id]?.name || '';
const isImp = t => (t?.importance||0) >= 4;
const sampleTag = o => o?.sample ? ' <span class="pill sample">sample</span>' : '';
const meter = n => `<span class="meter" title="Importance ${n||0}/5">${[1,2,3,4,5].map(i=>`<i class="${i<=(n||0)?'on':''}"></i>`).join('')}</span>`;
const revState = t => { if (!t.nextRev) return null; const n = diff(today(), t.nextRev); return n < 0 ? 'over' : n === 0 ? 'due' : 'later'; };
const dueTopics = () => sortBy(arr('topics').filter(t => { const r = revState(t); return r==='over'||r==='due'; }), t => t.nextRev);
const watched = v => arr('sessions').filter(s => s.videoId === v.id).reduce((a,s) => a + (s.min||0), 0);
const minsOn = d => arr('sessions').filter(s => s.d === d).reduce((a,s) => a + (s.min||0), 0);
const minsBetween = (a,b) => arr('sessions').filter(s => s.d >= a && s.d <= b).reduce((x,s) => x + (s.min||0), 0);
function dayTotals(){ const m = {}; arr('sessions').forEach(s => m[s.d] = (m[s.d]||0) + (s.min||0)); return m; }
function streak(){
  const goal = +S.settings.dailyGoalMin || 1; const tot = dayTotals(); let d = today(), n = 0;
  if ((tot[d]||0) < goal) d = addDays(d, -1);
  while ((tot[d]||0) >= goal) { n++; d = addDays(d, -1); }
  return n;
}
const missedPlans = () => arr('plans').filter(p => !p.done && p.date < today() && p.date >= addDays(today(), -30));

/* ================= UI state ================= */
const ui = {view:'today', subjectId:null, filter:'all', detail:null, showPast:false};
try { const v = localStorage.getItem(KEY+':view'); if (VIEWS.some(x=>x[0]===v)) ui.view = v; } catch(e){}
const hv = (location.hash||'').slice(1); if (VIEWS.some(x=>x[0]===hv)) ui.view = hv;

/* ================= chrome ================= */
function applyTheme(){ const t = S.settings.theme; if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }
function renderChrome(){
  const dc = dueTopics().length;
  $('#sideNav').innerHTML = VIEWS.map(([k,l],i) => `<button class="nav" data-act="go" data-v="${k}" ${ui.view===k?'aria-current="page"':''}>${ICON[k]}<span>${l}</span>${k==='revision'&&dc?`<span class="count">${dc}</span>`:''}<kbd>${i+1}</kbd></button>`).join('')
    + `<div class="sep"></div><button class="nav" data-act="startDlg">${ICON.play}<span>Start studying</span><kbd>S</kbd></button><button class="nav" data-act="practice">${ICON.cards}<span>Flashcards</span><kbd>F</kbd></button><button class="nav" data-act="settings">${ICON.gear}<span>Settings & backup</span></button>`;
  const lb = S.settings.lastBackup; const age = lb ? Math.floor((Date.now()-lb)/86400000) : null;
  const bk = fileState === 'ok' ? `<span class="bk ok"><i></i>Auto-backup on</span>` : fileState === 'reconnect' ? `<button class="btn sm" data-act="reconnectFile">Reconnect backup file</button>` : `<span class="bk ${age===null||age>6?'warn':'ok'}"><i></i>${age===null?'No backup yet':age===0?'Backed up today':`Last backup ${age}d ago`}</span>`;
  $('#sideFoot').innerHTML = `${bk}<span>${S.settings.examName?`Target: ${esc(S.settings.examName)}`:'Saved in this browser'}</span><span><kbd>?</kbd> shortcuts</span>`;
  document.title = (dc ? `(${dc}) ` : '') + 'BCS Prep Desk';
  renderTimer();
}

/* ================= timer / pomodoro ================= */
let tick = 0, audio = null, pomoAlerted = false;
function beep(){ try { audio = audio || new (window.AudioContext||window.webkitAudioContext)(); [0,0.35,0.7].forEach(t => { const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 880; o.connect(g); g.connect(audio.destination); g.gain.setValueAtTime(0.0001, audio.currentTime+t); g.gain.exponentialRampToValueAtTime(0.25, audio.currentTime+t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime+t+0.28); o.start(audio.currentTime+t); o.stop(audio.currentTime+t+0.3); }); } catch(e){} }
function timerLabel(t){ const tp = S.topics[t.topicId], v = S.videos[t.videoId]; return `${SKIND[t.kind]||'Study'} · ${v ? v.title : tp ? tp.name : subName(t.subjectId)}`; }
function renderTimer(){
  const t = S.timer, slot = $('#timerSlot');
  if (!t) { slot.innerHTML = ''; clearInterval(tick); tick = 0; return; }
  slot.innerHTML = `<span class="timer" id="timerChip"><span class="pulse"></span><span class="tt">${esc(timerLabel(t))}</span><span class="n" id="tnum">00:00</span><button data-act="stopTimer" title="Stop and log this session">Stop & log</button><button class="x" data-act="discardTimer" title="Discard without logging" aria-label="Discard">×</button></span>`;
  const upd = () => {
    const e = Math.max(0, Date.now() - t.startedAt); let show = e;
    const chip = $('#timerChip'); if (!chip) return;
    if (t.pomo) { const left = t.pomo*60000 - e; show = Math.abs(left); if (left <= 0) { chip.classList.add('pomo-done'); if (!pomoAlerted) { pomoAlerted = true; beep(); notify('Pomodoro finished', `${t.pomo} minutes done — take a short break and log it.`); } } }
    const m = Math.floor(show/60000), s = Math.floor(show/1000)%60, h = Math.floor(m/60);
    $('#tnum').textContent = (t.pomo && t.pomo*60000 - e <= 0 ? '+' : '') + (h ? `${h}:${String(m%60).padStart(2,'0')}` : String(m).padStart(2,'0')) + ':' + String(s).padStart(2,'0');
  };
  upd(); clearInterval(tick); tick = setInterval(upd, 1000);
}
function startTimer(o){
  if (S.timer) { toast('A timer is already running — stop it first'); return; }
  pomoAlerted = false; try { audio = audio || new (window.AudioContext||window.webkitAudioContext)(); } catch(e){}
  S.timer = {startedAt:Date.now(), kind:o.kind||'reading', subjectId:o.subjectId||null, topicId:o.topicId||null, videoId:o.videoId||null, pomo:o.pomo?+o.pomo:null};
  if (o.topicId && S.topics[o.topicId] && (S.topics[o.topicId].status||'todo') === 'todo') S.topics[o.topicId].status = 'doing';
  commit(o.pomo ? `Pomodoro started — ${o.pomo} minutes` : 'Timer started');
}
function stopTimer(){
  const t = S.timer; if (!t) return;
  const min = Math.max(1, Math.round((Date.now() - t.startedAt)/60000));
  addSession({d: ymd(new Date(t.startedAt)), at: t.startedAt, min, kind:t.kind, subjectId:t.subjectId, topicId:t.topicId, videoId:t.videoId});
  S.timer = null; commit(`Logged ${mins(min)}`);
}
function addSession(o){
  const id = uid(); S.sessions[id] = {id, ...o};
  if (o.videoId && S.videos[o.videoId]) { const v = S.videos[o.videoId]; if (v.lengthMin && watched(v) >= v.lengthMin) v.done = true; }
}

/* ================= notifications ================= */
function notify(title, body){
  if (S.settings.notify && 'Notification' in window && Notification.permission === 'granted') { try { new Notification(title, {body}); } catch(e){} }
  toast(body ? `${title} — ${body}` : title);
}
const notified = new Set();
function checkReminders(){
  const td = today(), now = hm(new Date());
  arr('plans').forEach(p => {
    if (p.date !== td || p.done || !p.time) return;
    const k = 'p:'+p.id+':'+p.date+p.time; if (notified.has(k)) return;
    if (p.time <= now && now <= addMinutes(p.time, 10)) { notified.add(k); const t = S.topics[p.topicId]; notify('Time to study', `${t ? t.name : (p.title||subName(p.subjectId))}${p.source?` · from ${p.source}`:''}${isImp(t)?' · HIGH-PRIORITY topic':''}`); }
  });
  if (S.settings.lastRevNotify !== td) { const n = dueTopics().length; if (n) { S.settings.lastRevNotify = td; persist(); notify('Revision due', `${n} topic${n>1?'s':''} need revision today`); } }
}
function addMinutes(t, n){ const [h,m] = t.split(':').map(Number); const x = h*60+m+n; return `${String(Math.floor(x/60)%24).padStart(2,'0')}:${String(x%60).padStart(2,'0')}`; }

/* ================= render ================= */
function render(){
  renderChrome();
  const title = ui.view==='subjects' && ui.subjectId && S.subjects[ui.subjectId] ? S.subjects[ui.subjectId].name : VIEWS.find(v=>v[0]===ui.view)[1];
  $('#viewTitle').textContent = title;
  try { $('#view').innerHTML = ({today:vToday, subjects:vSubjects, revision:vRevision, plan:vPlan, analysis:vAnalysis})[ui.view](); }
  catch(err) { console.error(err); $('#view').innerHTML = `<div class="alert rev"><span class="ic">!</span><div><b>Something went wrong showing this page</b><p>${esc(err.message)} — your data is safe. Try another view, or export a backup from Settings.</p></div></div>`; }
  if (ui.detail) renderDetail();
}

/* ----- REVISION ----- */
function vRevision(){
  const td = today();
  const withRev = sortBy(arr('topics').filter(t=>t.nextRev), t=>t.nextRev);
  const g = {over:[], due:[], week:[], later:[]};
  withRev.forEach(t => { const n = diff(td, t.nextRev); (n<0?g.over:n===0?g.due:n<=7?g.week:g.later).push(t); });
  const cards = arr('cards'), weakC = cards.filter(c=>(c.wrong||0) > (c.right||0)).length;
  const block = (title, list) => list.length ? `<section class="card"><h2>${title} <small>${list.length}</small></h2><div class="list">${list.map(t=>revRow(t,true)).join('')}</div></section>` : '';
  return `<div class="grid2">
    <div class="alert info" style="align-self:start"><span class="ic">↻</span><div><b>How the schedule works</b><p>Mark a topic “Completed” and the first revision comes the next day, then after ${INT.slice(1).join(', ')} days. “Hard” shortens the gap so weak topics come back more often.</p></div></div>
    <section class="card"><h2>Flashcards <small>${cards.length} cards${weakC?` · ${weakC} weak`:''}</small><span class="spacer"></span><button class="btn sm primary" data-act="practice">Practice</button></h2><p class="small muted" style="margin:0">Add quick Q&A cards inside any topic (facts, dates, names). Practice puts the ones you miss first.</p></section>
  </div>
  ${block('Overdue', g.over)}${block('Due today', g.due)}${block('This week', g.week)}${block('Later', g.later)}
  ${!withRev.length?'<div class="empty">No topic is completed yet. Open a topic and press “Completed” to start its revision schedule.</div>':''}`;
}

/* ----- PLAN ----- */
function vPlan(){
  const td = today();
  const plans = sortBy(arr('plans'), p=>p.date+(p.time||''));
  const future = plans.filter(p=>p.date>=td);
  const missed = missedPlans();
  const past = plans.filter(p=>p.date<td && p.date>=addDays(td,-14)).reverse();
  const gf = {}; future.forEach(p=>(gf[p.date]=gf[p.date]||[]).push(p));
  const days = Object.keys(gf).sort();
  const wk = []; for (let i=0;i<7;i++){ const d = addDays(td,i); const ps = gf[d]||[]; wk.push({d, n:ps.length, m:ps.reduce((a,p)=>a+(p.targetMin||0),0)}); }
  return `<div class="row"><span class="muted small">What, when and from where — plan it here</span><span class="spacer"></span><button class="btn sm" data-act="bulkPlan">Plan a week</button><button class="btn sm primary" data-act="addPlan" data-date="${td}">+ Plan</button><kbd>P</kbd></div>
  <section class="card"><h2>Next 7 days <small>planned time</small></h2>
    <div class="hbar">${wk.map(x=>`<span class="lbl">${x.d===td?'Today':fmtD(x.d)}</span><span class="trk"><i style="width:${Math.min(100,pct(x.m, Math.max(+S.settings.dailyGoalMin||240, ...wk.map(y=>y.m))))}%"></i></span><span class="val">${x.n?`${x.n} · ${mins(x.m)}`:'—'}</span>`).join('')}</div>
  </section>
  ${missed.length?`<section class="card"><h2>Missed <small>${missed.length}</small><span class="spacer"></span><button class="btn sm" data-act="moveAllMissed">Move all to today</button></h2><div class="list">${sortBy(missed,p=>p.date).map(p=>planRow(p,true)).join('')}</div></section>`:''}
  <section class="card"><h2>Upcoming</h2>

    ${ui.showPast ? (past.length ? `<div class="list">${past.map(p=>planRow(p,true)).join('')}</div>` : '<div class="empty">Nothing here</div>') : ''}

/* ----- ANALYSIS ----- */
function heatmap(){
  const td = today(), tot = dayTotals(), goal = +S.settings.dailyGoalMin || 240;
  const end = parse(td); const start = new Date(end); start.setDate(start.getDate() - 7*17 - ((end.getDay()+6)%7)); // Monday, 18 weeks
  const cells = []; const d = new Date(start);
  const endW = new Date(end); endW.setDate(endW.getDate() + (7 - ((end.getDay()+6)%7) - 1));
  while (d <= endW) { const s = ymd(d); const m = tot[s]||0; const fut = s > td; const l = fut ? 'fut' : !m ? '' : m < goal*0.25 ? 'l1' : m < goal*0.6 ? 'l2' : m < goal ? 'l3' : 'l4'; cells.push(`<i class="${l} ${s===td?'td':''}" title="${fmtD(s)}: ${fut?'—':mins(m)}"></i>`); d.setDate(d.getDate()+1); }
  return `<div class="heat" role="img" aria-label="Study minutes per day, last 18 weeks">${cells.join('')}</div>
  <div class="legend">Less <i style="background:var(--surface-2)"></i><i style="background:color-mix(in srgb,var(--accent) 25%,var(--surface-2))"></i><i style="background:color-mix(in srgb,var(--accent) 50%,var(--surface-2))"></i><i style="background:color-mix(in srgb,var(--accent) 75%,var(--surface-2))"></i><i style="background:var(--accent)"></i> Goal met (${mins(goal)})</div>`;
}
function studyBars(){
  const td = today(); const days = []; for (let i=13;i>=0;i--) days.push(addDays(td,-i));
  const tot = dayTotals(); const vals = days.map(d=>tot[d]||0); const goal = +S.settings.dailyGoalMin||240;
  const top = Math.ceil(Math.max(60, goal, ...vals)/60)*60; const W=420, H=180, L=34, B=22, T=8; const cw=(W-L)/days.length; const bw=Math.max(6, cw-10);
  const y = v => T + (H-T-B) * (1 - v/top);
  const ticks = [0, top/2, top];
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Study time, last 14 days">
    ${ticks.map(tk=>`<line class="gl" x1="${L}" x2="${W}" y1="${y(tk)}" y2="${y(tk)}"/><text class="axl" x="${L-6}" y="${y(tk)+4}" text-anchor="end">${round1(tk/60)}h</text>`).join('')}
    <line x1="${L}" x2="${W}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--haldi)" stroke-dasharray="4 4" stroke-width="1.5"/><text class="axl" x="${W}" y="${y(goal)-5}" text-anchor="end" style="fill:var(--haldi-ink)">goal</text>
    ${days.map((d,i)=>{ const v=vals[i], x=L+i*cw+(cw-bw)/2, hh=(H-T-B)*v/top; return `<g><title>${fmtD(d)}: ${mins(v)}</title><rect x="${L+i*cw}" y="${T}" width="${cw}" height="${H-T-B}" fill="transparent"/><rect class="b" x="${x}" y="${y(v)}" width="${bw}" height="${v?Math.max(2,hh):0}" rx="2"/>${i%2===1?`<text class="axl" x="${x+bw/2}" y="${H-5}" text-anchor="middle">${parse(d).getDate()}</text>`:''}</g>`; }).join('')}
  </svg></div>`;
}
function scoreLine(exams){
  const ex = sortBy(exams.filter(e=>e.total>0), e=>e.date);
  if (ex.length < 2) return `<div class="empty">Log two or more exams to see your score trend${ex.length?` — latest: ${ex[0].score}/${ex[0].total}`:''}</div>`;
  const W=420,H=180,L=34,R=16,B=22,T=16;
  const y = v => T+(H-T-B)*(1-v/100);
  const pts = ex.map((e,i)=>({x: L + i*(W-L-R)/(ex.length-1), y: y(e.score/e.total*100), e}));
  const lp = pts[pts.length-1];
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Exam score percentage over time">
    ${[0,50,100].map(v=>`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="axl" x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}%</text>`).join('')}
    <polyline class="ln" points="${pts.map(p=>`${p.x},${p.y}`).join(' ')}"/>
    ${pts.map((p,i)=>`<circle class="pt" cx="${p.x}" cy="${p.y}" r="${i===pts.length-1?6:4.5}"><title>${esc(p.e.name)} · ${fmtD(p.e.date)} · ${p.e.score}/${p.e.total} (${pct(p.e.score,p.e.total)}%)</title></circle>`).join('')}
    <text class="axl" x="${lp.x}" y="${lp.y-11}" text-anchor="end" style="fill:var(--ink)">${pct(lp.e.score,lp.e.total)}%</text>
  </svg></div>`;
}
function vAnalysis(){
  const td = today();
  const exams = sortBy(arr('exams'), e=>e.date, -1);
  const ms = arr('mistakes'), open = ms.filter(m=>!m.resolved);
  const subs = subjects();
  // week comparison
  const w0 = [addDays(td,-6), td], w1 = [addDays(td,-13), addDays(td,-7)];
  const cnt = (list, f, [a,b]) => list.filter(x => { const d = f(x); return d && d >= a && d <= b; }).length;
  const revs = r => arr('topics').reduce((a,t)=>a+(t.revLog||[]).filter(x=>x.d>=r[0]&&x.d<=r[1]).length,0);
  const cmp = [
    ['Study hours', round1(minsBetween(...w0)/60), round1(minsBetween(...w1)/60)],
    ['Topics completed', cnt(arr('topics'), t=>t.studiedAt, w0), cnt(arr('topics'), t=>t.studiedAt, w1)],
    ['Revisions done', revs(w0), revs(w1)],
    ['Plans finished', arr('plans').filter(p=>p.done&&p.date>=w0[0]&&p.date<=w0[1]).length, arr('plans').filter(p=>p.done&&p.date>=w1[0]&&p.date<=w1[1]).length]
  ];
  // subject time 30d
  const m30 = addDays(td,-29);
  const tBy = subs.map(s=>({s, m: arr('sessions').filter(x=>x.subjectId===s.id&&x.d>=m30).reduce((a,x)=>a+x.min,0)})).filter(x=>x.m).sort((a,b)=>b.m-a.m);
  const mxT = Math.max(1, ...tBy.map(x=>x.m));
  // coverage
  const cov = subs.map(s=>{ const ts=topicsOf(s.id); return {s, d: ts.filter(t=>t.status==='done').length, n: ts.length}; });
  const wMarks = subs.reduce((a,s)=>a+(+s.marks||0),0) || 1;
  const covered = cov.reduce((a,c)=>a + (c.n ? (c.d/c.n)*(+c.s.marks||0) : 0), 0);
  // subject accuracy from exams
  const acc = subs.map(s => { let c=0,w=0,net=0,k=0; exams.forEach(e => { const b = e.bySubject?.[s.id]; if (b && (b.c||b.w)) { c+=+b.c||0; w+=+b.w||0; net += (+b.c||0) - (e.neg??0.5)*(+b.w||0); k++; } }); return {s, c, w, k, avg: k? net/k : 0}; }).filter(x=>x.k);
  // mistakes
  const bySub = subs.map(s=>({s, n: open.filter(m=>m.subjectId===s.id).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n);
  const mxS = Math.max(1, ...bySub.map(x=>x.n));
  const tByM = {}; open.forEach(m=>{ if (m.topicId) tByM[m.topicId]=(tByM[m.topicId]||0)+1; });
  const weak = Object.entries(tByM).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([id,n])=>({t:S.topics[id], n})).filter(x=>x.t);
  const negLost = exams.reduce((a,e)=>a + (e.wrong ? e.wrong*(e.neg??0.5) : 0), 0);
  return `<div class="row"><span class="muted small">Take exams, log mistakes — the app shows where to push</span><span class="spacer"></span><button class="btn sm" data-act="addMistake">+ Mistake / weak area</button><button class="btn sm primary" data-act="addExam">+ Exam</button></div>
  <section class="card"><h2>This week vs last week</h2><div class="cmp">${cmp.map(([k,a,b])=>{ const d = round1(a-b); return `<div><div class="k">${k}</div><div class="v">${a}</div><div class="d ${d>0?'up':d<0?'down':'muted'}">${d>0?'▲ +':d<0?'▼ ':''}${d===0?'same as last week':`${d} vs last week`}</div></div>`; }).join('')}</div></section>
  <section class="card"><h2>Study consistency <small>last 18 weeks</small><span class="spacer"></span><span class="small muted">${streak()} day streak</span></h2>${heatmap()}</section>
  <div class="grid2">
    <section class="card"><h2>Exam score trend</h2>${scoreLine(exams)}</section>
    <section class="card"><h2>Study time <small>last 14 days</small></h2>${studyBars()}</section>
    <section class="card"><h2>Subject-wise exam performance <small>avg net marks per exam</small></h2>
      ${acc.length?`<div class="hbar">${acc.map(x=>`<span class="lbl" title="${esc(x.s.name)}">${esc(x.s.name)}</span><span class="trk"><i style="width:${Math.max(0,Math.min(100,pct(x.avg, +x.s.marks||1)))}%"></i></span><span class="val">${round1(x.avg)}/${x.s.marks} · ${pct(x.c,x.c+x.w)}% acc.</span>`).join('')}</div><p class="small muted" style="margin:10px 0 0">Accuracy = correct ÷ attempted. Low accuracy with many attempts means guessing is costing you negative marks.</p>`:'<div class="empty">Add a subject breakdown when you log an exam to see this</div>'}
    </section>
    <section class="card"><h2>Syllabus coverage <small>${pct(covered,wMarks)}% by marks</small></h2>
      <div class="hbar">${cov.map(c=>`<span class="lbl" title="${esc(c.s.name)}">${esc(c.s.name)}</span><span class="trk"><i style="width:${pct(c.d,c.n)}%"></i></span><span class="val">${c.d}/${c.n}</span>`).join('')}</div>
    </section>
    <section class="card"><h2>Time by subject <small>last 30 days</small></h2>
      ${tBy.length?`<div class="hbar">${tBy.map(x=>`<span class="lbl">${esc(x.s.name)}</span><span class="trk"><i style="width:${pct(x.m,mxT)}%"></i></span><span class="val">${mins(x.m)} · ${x.s.marks}m</span>`).join('')}</div><p class="small muted" style="margin:10px 0 0">Compare time spent with the subject's marks to spot what you're neglecting.</p>`:'<div class="empty">Log study time to see this</div>'}
    </section>
    <section class="card"><h2>Open mistakes <small>by subject</small></h2>
      ${bySub.length?`<div class="hbar">${bySub.map(x=>`<span class="lbl">${esc(x.s.name)}</span><span class="trk"><i class="warm" style="width:${pct(x.n,mxS)}%"></i></span><span class="val">${x.n}</span>`).join('')}</div>`:'<div class="empty">No open mistakes</div>'}
      ${weak.length?`<div class="small muted" style="margin:14px 0 4px">Weakest topics</div><div class="list">${weak.map(({t,n})=>`<div class="item clk" data-act="openTopic" data-id="${t.id}"><div class="mt"><div class="t">${esc(t.name)}</div><div class="s"><span>${esc(subName(t.subjectId))}</span></div></div><span class="pill over">${n} open</span></div>`).join('')}</div>`:''}
    </section>
  </div>
  <section class="card"><h2>Exams <small>${exams.length}${negLost?` · ${round1(negLost)} marks lost to negative marking`:''}</small></h2>
    ${exams.length?`<div class="tablewrap"><table class="t"><thead><tr><th>Exam</th><th>Date</th><th class="n">Correct</th><th class="n">Wrong</th><th class="n">Neg. lost</th><th class="n">Score</th><th class="n">%</th><th class="n">Mistakes</th><th></th></tr></thead><tbody>${exams.map(e=>`<tr><td>${esc(e.name)}${sampleTag(e)}</td><td>${fmtD(e.date)}</td><td class="n">${e.correct??'—'}</td><td class="n">${e.wrong??'—'}</td><td class="n">${e.wrong?round1(e.wrong*(e.neg??0.5)):'—'}</td><td class="n">${e.score}/${e.total}</td><td class="n">${pct(e.score,e.total)}</td><td class="n">${ms.filter(m=>m.examId===e.id).length}</td><td><button class="btn sm ghost" data-act="addMistake" data-exam="${e.id}">+ mistake</button><button class="icon-btn" data-act="editExam" data-id="${e.id}" aria-label="Edit">✎</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Log your model tests and practice exams here</div>'}
  </section>
  <section class="card"><h2>Mistake & weak-area log <small>${open.length} open</small></h2>
    <div class="list">${ms.length ? sortBy(ms, m=>(m.resolved?'1':'0')+(m.date||'')).map(mistakeRow).join('') : '<div class="empty">Nothing logged yet</div>'}</div>
  </section>`;
}

function openDialog(title, body, onSubmit, opt={}){
  const L = $('#dialogLayer');
  L.innerHTML = `<div class="scrim dlg-scrim" data-act="closeDialog"></div><div class="dialog"><form class="dlg-card ${opt.wide?'wide':''}" autocomplete="off" novalidate><header><h3>${esc(title)}</h3><button type="button" class="icon-btn" data-act="closeDialog" aria-label="Close">×</button></header><div class="dlg-body">${body}</div>${onSubmit?`<footer>${opt.del?`<button type="button" class="btn danger" data-act="del" data-col="${opt.del[0]}" data-id="${opt.del[1]}" style="margin-right:auto">Delete</button>`:'<span class="small muted" style="margin-right:auto"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> to save</span>'}<button type="button" class="btn ghost" data-act="closeDialog">Cancel</button><button type="submit" class="btn primary">${opt.submit||'Save'}</button></footer>`:''}</form></div>`;
  L.hidden = false;
  const f = L.querySelector('form'); wireDeps(f);
  if (onSubmit) {
    f.addEventListener('submit', e => {
      e.preventDefault();
      const bad = [...f.querySelectorAll('[required]')].find(x => !String(x.value).trim());
      if (bad) { bad.focus(); toast('Please fill in the required field'); return; }
      const fd = {}; new FormData(f).forEach((v,k)=>{ fd[k] = typeof v === 'string' ? v.trim() : v; });
      f.querySelectorAll('input[type=checkbox]').forEach(c => fd[c.name] = c.checked);
      const next = onSubmit(fd, f);
      if (next === false) return;
      closeDialog(); commit(opt.ok);
      if (typeof next === 'function') next();
    });
    f.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey||e.metaKey)) { e.preventDefault(); f.requestSubmit(); } });
  }
  if (opt.mount) opt.mount(f);
  setTimeout(() => (f.querySelector('[autofocus]') || f.querySelector('input:not([type=radio]):not([type=checkbox]):not([type=file]),textarea'))?.focus({preventScroll:true}), 30);
  return f;
}
const impField = v => `<div class="fld"><span>Importance (from your question analysis)</span><div class="stars">${[1,2,3,4,5].map(i=>`<label><input type="radio" name="importance" value="${i}" ${i===(+v||3)?'checked':''}><span>${i}</span></label>`).join('')}</div><small>4–5 marks the topic high-priority: you'll get a warning whenever you open or plan it</small></div>`;

function dlgBulkPlan(){
  const td = today();
  openDialog('Plan a week', `
    <p class="small muted" style="margin:0">One line per study block. Each line: <span class="mono">day offset | time | subject | topic or task | source | minutes</span>. Day offset 0 = today, 1 = tomorrow… Subject can be the first word of its name.</p>
    ${fld('Blocks', `<textarea name="lines" style="min-height:190px;font-family:var(--f-mono);font-size:.85rem" placeholder="0 | 20:00 | Bangla | সমাস | Grammar book ch. 5 | 60\n1 | 09:00 | Math | Percentage | Previous years' questions | 90\n1 | 19:00 | Bangladesh | Constitution | Class notes | 60"></textarea>`)}
  `, d => {
    const subs = subjects(); let n = 0;
    d.lines.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l => {
      const [off, time, sub, what, source, m] = l.split(/\s*[|\t]\s*/);
      const s = subs.find(x => x.name.toLowerCase().startsWith((sub||'').toLowerCase())) || subs.find(x => x.name.toLowerCase().includes((sub||'').toLowerCase()));
      if (!s) return;
      const t = topicsOf(s.id).find(x => x.name.toLowerCase() === (what||'').toLowerCase()) || topicsOf(s.id).find(x => (what||'') && x.name.toLowerCase().includes(what.toLowerCase()));
      const id = uid()+n; S.plans[id] = {id, date:addDays(td, +off||0), time:(time||'').match(/^\d{1,2}:\d{2}$/)?time.padStart(5,'0'):'', subjectId:s.id, topicId:t?.id||null, title:t?'':(what||''), source:source||'', targetMin:m?+m:null, done:false, createdAt:Date.now()}; n++;
    });
    if (!n) { toast('No lines matched a subject'); return false; }
    setTimeout(()=>toast(`${n} blocks planned`), 0);
  }, {submit:'Add to planner', wide:true});
}
function dlgExam(x){
  const e = x || {}, neg = e.neg ?? S.settings.negMark ?? 0.5;
  const bd = subjects().map(s => `<span>${esc(s.name)} <span class="muted">(${s.marks})</span></span><input name="c_${s.id}" type="number" min="0" value="${esc(e.bySubject?.[s.id]?.c ?? '')}" aria-label="${esc(s.name)} correct"><input name="w_${s.id}" type="number" min="0" value="${esc(e.bySubject?.[s.id]?.w ?? '')}" aria-label="${esc(s.name)} wrong">`).join('');
  openDialog(x ? 'Edit exam' : 'Log an exam', `
    ${fld('Exam name', `<input name="name" required value="${esc(e.name)}" placeholder="e.g. Model Test 3">`)}
    <div class="fgrid3">${fld('Date', `<input name="date" type="date" required value="${esc(e.date || today())}">`)}${fld('Total marks', `<input name="total" type="number" min="1" required value="${esc(e.total ?? 200)}">`)}${fld('Negative per wrong', `<input name="neg" type="number" step="0.05" min="0" value="${esc(neg)}">`)}</div>
    <div class="fgrid3">${fld('Correct', `<input name="correct" type="number" min="0" value="${esc(e.correct ?? '')}">`)}${fld('Wrong', `<input name="wrong" type="number" min="0" value="${esc(e.wrong ?? '')}">`)}${fld('Score (auto)', `<input name="score" type="number" step="0.25" value="${esc(e.score ?? '')}">`, '', 'Filled from correct/wrong; edit if needed')}</div>
    <div class="calc" id="calc"></div>
    <details class="more" ${e.bySubject && Object.keys(e.bySubject).length ? 'open' : ''}><summary>Subject-wise breakdown (optional — powers the subject performance chart)</summary>
      <div class="bd"><span class="h">Subject</span><span class="h">Correct</span><span class="h">Wrong</span>${bd}</div>
      <button type="button" class="btn sm" id="sumBd" style="margin-top:10px">Fill totals from breakdown</button>
    </details>
    ${fld('Notes', `<textarea name="note" placeholder="Time management, what felt hard…">${esc(e.note)}</textarea>`)}
  `, d => {
    const bySubject = {}; subjects().forEach(s => { const c = d['c_'+s.id], w = d['w_'+s.id]; if (c !== '' || w !== '') bySubject[s.id] = {c:+c||0, w:+w||0}; });
    const correct = d.correct === '' ? null : +d.correct, wrong = d.wrong === '' ? null : +d.wrong, ng = d.neg === '' ? 0.5 : +d.neg;
    let score = d.score === '' ? (correct !== null ? correct - ng*(wrong||0) : NaN) : +d.score;
    if (isNaN(score)) { toast('Enter correct/wrong counts or a score'); return false; }
    const data = {name:d.name, date:d.date, total:+d.total, neg:ng, correct, wrong, score:Math.round(score*100)/100, bySubject, note:d.note};
    if (x) { Object.assign(S.exams[x.id], data); return; }
    const id = uid(); S.exams[id] = {id, ...data, createdAt:Date.now()};
    return () => dlgMistake(null, {examId:id});
  }, {del: x ? ['exams', x.id] : null, ok: x ? 'Saved' : 'Exam logged — now note down the mistakes', wide:true, mount: f => {
    const g = n => f.querySelector(`[name="${n}"]`); let manual = !!x;
    const upd = () => { const c = +g('correct').value||0, w = +g('wrong').value||0, ng = +g('neg').value||0, tot = +g('total').value||200; const sc = c - ng*w; if (!manual && (g('correct').value!==''||g('wrong').value!=='')) g('score').value = Math.round(sc*100)/100; const skip = Math.max(0, tot - c - w); $('#calc').textContent = (g('correct').value!=='' ? `Attempted ${c+w} · skipped ${skip} · lost ${Math.round(ng*w*100)/100} to negatives · accuracy ${pct(c,c+w)}%` : 'Enter correct and wrong to auto-calculate the score'); };
    ['correct','wrong','neg','total'].forEach(n => g(n).addEventListener('input', () => { manual = false; upd(); }));
    g('score').addEventListener('input', () => manual = true);
    f.querySelector('#sumBd').addEventListener('click', () => { let c=0,w=0; subjects().forEach(s => { c += +g('c_'+s.id).value||0; w += +g('w_'+s.id).value||0; }); g('correct').value = c; g('wrong').value = w; manual = false; upd(); });
    upd();
  }});
}
